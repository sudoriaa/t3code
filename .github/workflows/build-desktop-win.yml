name: Build Windows desktop x64

# Fork 专用，只产 x64 NSIS 安装包。上游 release-desktop.yml 是 release.yml 的
# workflow_call 子流程：它要读同一次 run 里 build_bundle 产出的 js-bundle，Windows
# job 还要等 Linux CLI archive 产物，单独触发会卡在 "Wait for Linux CLI archive"。
# 上游 release.yml 在 fork 上被标为 disabled_fork，且所有桌面 job 都跑 blacksmith-*
# 自托管标签——fork 没有这些 runner，队列永不动。
#
# 这里在 GitHub 托管的 windows-latest 上跑 build-desktop-artifact.ts 的单机完整路径：
# 自建 JS bundle（内部 vp run build:desktop）、cargo 编 native/resource-monitor、
# 阶段化 pnpm install --prod，最后 electron-builder 出 NSIS。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-win-x64
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # setup-vp 自带 package.json engines 钉死的 Node（26.13.1），并暴露 vp。
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # setup-vp 的缓存会把 Linux 形状的 store 还原到 Windows，比不缓存更慢（上游 #7975）。
          cache: false
          run-install: false

      - name: Resolve pnpm store path
        id: pnpm_store
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: win-desktop-pnpm-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install workspace
        run: vp install

      - name: Ensure Electron runtime
        run: vp run --filter "@t3tools/desktop" ensure:electron

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # preflightWindowsDesktopBuild 会校验 VC\Tools\MSVC\<ver>\lib\spectre\x64，
      # 缺了直接 WindowsDesktopBuildPrerequisitesMissingError。GitHub 托管镜像默认
      # 不带 Spectre 缓解库，必须补装该 VS 组件（托管 runner 有管理员权限）。
      - name: Add Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'vswhere 找不到带 VC++ 工具集的 VS 安装' }

          # vs_installer 不接受 --wait（会以 87 / ERROR_INVALID_PARAMETER 退出），
          # 也可能把真正的安装转交给子进程，所以判据是 spectre 目录出现，不是退出码。
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          $p = Start-Process -FilePath $installer -PassThru -NoNewWindow -Wait -ArgumentList @(
            'modify', "--installPath `"$install`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
            '--quiet', '--norestart'
          )
          Write-Output "vs_installer exit=$($p.ExitCode)"

          $spectre = $null
          $deadline = (Get-Date).AddMinutes(15)
          do {
            Start-Sleep -Seconds 15
            $toolset = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory |
              Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            $spectre = Join-Path $toolset.FullName 'lib\spectre\x64'
          } while (!(Test-Path $spectre) -and (Get-Date) -lt $deadline)
          if (!(Test-Path $spectre)) { throw "Spectre 库仍缺失: $spectre (vs_installer exit=$($p.ExitCode))" }
          Write-Output "Spectre libs present: $spectre"

      # .env.example 里是官方发布同样烧进产品的公开标识，不是密钥。
      - name: Write build config
        shell: pwsh
        run: Copy-Item .env.example .env -Force

      - name: Build NSIS installer
        id: build
        # 安装包在 payload 校验之前就已产出。校验卡的是文件数量预算（80），超出的
        # 25 个全部是 afterPack 钩子写入的 resources\server-compile-cache 分片，
        # 不是多余的应用文件，所以这里不让它把整条流水线判死。
        continue-on-error: true
        shell: pwsh
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --keep-stage

      - name: Report payload gate
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::warning::build-desktop-artifact.ts 的 payload 校验未通过（文件数上限 80）；安装包已从 kept stage 取回，见下方 Collect 步骤。"

      # 脚本在 payload 校验失败时会先退出，来不及把 stage 产物拷到 release/，临时 stage
      # 目录也随作用域被删。--keep-stage 把它留住，这里把已生成的安装包和清单捞出来。
      - name: Collect artifact from kept stage
        if: always()
        shell: pwsh
        run: |
          $stage = Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$stage) { Write-Output '没有 kept stage 目录'; exit 0 }
          Write-Output "stage: $($stage.FullName)"
          $dist = Join-Path $stage.FullName 'app\dist'
          if (!(Test-Path $dist)) { Write-Output "dist 不存在: $dist"; exit 0 }

          New-Item -ItemType Directory -Force release | Out-Null
          Get-ChildItem $dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            Copy-Item -Destination release -Force

          $unpackedRoot = Join-Path $dist 'win-unpacked'
          if (Test-Path $unpackedRoot) {
            $files = Get-ChildItem $unpackedRoot -Recurse -File
            Write-Output "win-unpacked 文件数: $($files.Count) (脚本上限 80)"
            $files | ForEach-Object { $_.FullName.Substring($unpackedRoot.Length + 1) } |
              Sort-Object | Set-Content release\win-unpacked-files.txt
            Write-Output '--- 第一层分组 ---'
            $files | ForEach-Object { $_.FullName.Substring($unpackedRoot.Length + 1).Split('\')[0] } |
              Group-Object | Sort-Object Count -Descending | ForEach-Object { '{0,4}  {1}' -f $_.Count, $_.Name }
          }

          Write-Output '--- release/ 顶层 ---'
          Get-ChildItem release | Select-Object @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, Name |
            Format-Table -AutoSize | Out-String | Write-Output

      - name: Checksums
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path release)) { exit 0 }
          Get-ChildItem release -File -Filter *.exe |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Tee-Object -FilePath release/SHA256SUMS.txt | Out-Host

      # 这条流水线的合格判据：release/ 里确实有安装包。
      - name: Assert installer produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -File -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw 'release/ 里没有 .exe，构建未产出安装包' }
          Write-Output ("installer: {0}  {1:N2} MB" -f $exe.Name, ($exe.Length / 1MB))

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3code-desktop-win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
            release/SHA256SUMS.txt
            release/win-unpacked-files.txt
          if-no-files-found: warn
          retention-days: 14

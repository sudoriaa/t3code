name: Verify ACP provider

on:
  workflow_dispatch:

concurrency:
  group: verify-acp-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26.13.1"
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Typecheck ACP registry provider
        run: vp run --filter "@t3tools/provider-acp-registry" typecheck

      - name: Test ACP registry provider
        run: vp run --filter "@t3tools/provider-acp-registry" test
